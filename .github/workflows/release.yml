name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.15.22
      - name: Verify version
        shell: pwsh
        run: |
          $version = python -c "from hwtstudio import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match desktop version v$version"
          }
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check hwtstudio tests tools run.py
          python -m compileall -q hwtstudio tests tools
          python -m unittest discover -s tests -v
      - name: Build EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "大雪主题编辑器" --add-data "assets;assets"
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick run.py
      - name: Prepare desktop assets
        shell: pwsh
        run: |
          $asset = "HwtThemeStudio-${{ github.ref_name }}-win64.exe"
          Copy-Item -LiteralPath "dist\大雪主题编辑器.exe" -Destination $asset
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: |
            HwtThemeStudio-${{ github.ref_name }}-win64.exe
            HwtThemeStudio-${{ github.ref_name }}-win64.exe.sha256

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          test "v$VERSION" = "${{ github.ref_name }}" || (echo "Tag does not match Android version v$VERSION" && exit 1)
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 is not configured" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release.keystore"
      - name: Test, lint and build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Prepare Android assets
        run: |
          ASSET="HwtThemeReceiver-${{ github.ref_name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            HwtThemeReceiver-${{ github.ref_name }}.apk
            HwtThemeReceiver-${{ github.ref_name }}.apk.sha256

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" release-assets/*
          --repo "${{ github.repository }}"
          --generate-notes --title "${{ github.ref_name }}"
