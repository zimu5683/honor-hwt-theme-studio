name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt ruff==0.15.22
          choco install innosetup --no-progress --yes
      - name: Verify version
        shell: pwsh
        run: |
          $version = python -c "from hwtstudio import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match desktop version v$version"
          }
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check hwtstudio tests tools run.py
          python -m compileall -q hwtstudio tests tools
          python -m unittest discover -s tests -v
      - name: Build portable desktop app
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --noupx
          --name "大雪主题编辑器" --add-data "assets;assets"
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick run.py
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = python -c "from hwtstudio import __version__; print(__version__)"
          $source = (Resolve-Path -LiteralPath "dist\大雪主题编辑器").Path
          $output = (Get-Location).Path
          $baseName = "HwtThemeStudio-${{ github.ref_name }}-win64-Setup"
          $language = Join-Path $env:RUNNER_TEMP "ChineseSimplified.isl"
          $languageUrl = "https://raw.githubusercontent.com/jrsoftware/issrc/c43704780a8e9862376348c580ac8920ed2c123b/Files/Languages/ChineseSimplified.isl"
          $languageHash = "e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d"
          Invoke-WebRequest -UseBasicParsing -Uri $languageUrl -OutFile $language
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $language).Hash.ToLowerInvariant() -ne $languageHash) {
            throw "Inno Setup 简体中文语言文件校验失败"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$output" "/DOutputBaseFilename=$baseName" "/DLanguageFile=$language" "installer\HwtThemeStudio.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare desktop assets
        shell: pwsh
        run: |
          $zipAsset = "HwtThemeStudio-${{ github.ref_name }}-win64.zip"
          $setupAsset = "HwtThemeStudio-${{ github.ref_name }}-win64-Setup.exe"
          $package = "dist\大雪主题编辑器"
          if (-not (Test-Path -LiteralPath "$package\大雪主题编辑器.exe")) {
            throw "onedir 构建结果缺少桌面程序"
          }
          if (-not (Test-Path -LiteralPath $setupAsset)) {
            throw "Inno Setup 构建结果缺少安装器"
          }
          Compress-Archive -LiteralPath $package -DestinationPath $zipAsset -CompressionLevel Optimal
          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipAsset).Hash.ToLowerInvariant()
          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setupAsset).Hash.ToLowerInvariant()
          "$zipHash  $zipAsset" | Set-Content -Encoding ascii "$zipAsset.sha256"
          "$setupHash  $setupAsset" | Set-Content -Encoding ascii "$setupAsset.sha256"
          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          $baseUrl = "https://github.com/$repo/releases/download/$tag"
          @{
            version = $tag
            url = "https://github.com/$repo/releases/tag/$tag"
            body = "GitHub Release $tag"
            assets = @(
              @{ name = $setupAsset; url = "$baseUrl/$setupAsset"; sha256 = $setupHash }
              @{ name = "$setupAsset.sha256"; url = "$baseUrl/$setupAsset.sha256" }
              @{ name = $zipAsset; url = "$baseUrl/$zipAsset"; sha256 = $zipHash }
              @{ name = "$zipAsset.sha256"; url = "$baseUrl/$zipAsset.sha256" }
            )
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 latest.json
      - name: Generate differential patch and merge into latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install bsdiff4
          $zip = "HwtThemeStudio-${{ github.ref_name }}-win64.zip"
          python tools/generate_patch.py $zip "${{ github.ref_name }}"
          if (Test-Path -LiteralPath "patch-meta.json") {
            $meta = Get-Content -Raw -LiteralPath "patch-meta.json" | ConvertFrom-Json
            $latest = Get-Content -Raw -LiteralPath "latest.json" | ConvertFrom-Json
            $patchObj = [ordered]@{
              name          = $meta.name
              url           = $meta.url
              sha256        = $meta.sha256
              from_sha256   = $meta.from_sha256
              target_sha256 = $meta.target_sha256
            }
            $latest | Add-Member -NotePropertyName "patches" -NotePropertyValue @($patchObj) -Force
            $latest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 latest.json
          }
      - name: Verify custom-path install and uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path -LiteralPath "HwtThemeStudio-${{ github.ref_name }}-win64-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "Hwt Studio Custom Install"
          $markerDir = Join-Path $env:LOCALAPPDATA "HwtThemeStudio"
          $marker = Join-Path $markerDir "installer-data-preserved.txt"
          New-Item -ItemType Directory -Force -Path $markerDir | Out-Null
          Set-Content -Encoding utf8 -LiteralPath $marker -Value "preserve"
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', "/DIR=`"$installDir`"")
          $install = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup failed with exit code $($install.ExitCode)" }
          $exe = Join-Path $installDir "大雪主题编辑器.exe"
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path -LiteralPath $exe) -or -not (Test-Path -LiteralPath $uninstaller) -or -not (Test-Path -LiteralPath (Join-Path $installDir '_internal'))) {
            throw "自定义路径安装结果不完整"
          }
          $programShortcut = Join-Path ([Environment]::GetFolderPath('Programs')) "大雪主题编辑器\大雪主题编辑器.lnk"
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) "大雪主题编辑器.lnk"
          if (-not (Test-Path -LiteralPath $programShortcut) -or -not (Test-Path -LiteralPath $desktopShortcut)) {
            throw "安装器未创建预期快捷方式"
          }
          $app = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 250
            $app.Refresh()
          } while (-not $app.HasExited -and $app.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
          if ($app.HasExited -or $app.MainWindowHandle -eq 0 -or $app.MainWindowTitle -notlike '大雪主题编辑器*') {
            throw "安装后的主程序未正常显示主窗口"
          }
          Stop-Process -Id $app.Id -Force
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed with exit code $($uninstall.ExitCode)" }
          if (Test-Path -LiteralPath $exe) { throw "卸载后主程序仍然存在" }
          if (-not (Test-Path -LiteralPath $marker)) { throw "卸载错误删除了用户数据" }
          Remove-Item -LiteralPath $marker -Force
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-release
          path: |
            HwtThemeStudio-${{ github.ref_name }}-win64.zip
            HwtThemeStudio-${{ github.ref_name }}-win64.zip.sha256
            HwtThemeStudio-${{ github.ref_name }}-win64-Setup.exe
            HwtThemeStudio-${{ github.ref_name }}-win64-Setup.exe.sha256
            *.patch
            latest.json

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          test "v$VERSION" = "${{ github.ref_name }}" || (echo "Tag does not match Android version v$VERSION" && exit 1)
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 is not configured" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release.keystore"
      - name: Test, lint and build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Prepare Android assets
        run: |
          ASSET="HwtThemeReceiver-${{ github.ref_name }}.apk"
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts | head -1)
          cp android/app/build/outputs/apk/release/app-release.apk "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          APK_SHA256=$(cut -d' ' -f1 "$ASSET.sha256")
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          jq -n \
            --arg version "$TAG" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apk_url "https://github.com/$REPO/releases/download/$TAG/$ASSET" \
            --arg apk_sha256 "$APK_SHA256" \
            --arg body "GitHub Release $TAG" \
            '{version: $version, versionCode: $versionCode, apk_url: $apk_url, apk_sha256: $apk_sha256, body: $body}' \
            > latest-android.json
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            HwtThemeReceiver-${{ github.ref_name }}.apk
            HwtThemeReceiver-${{ github.ref_name }}.apk.sha256
            latest-android.json

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" release-assets/*
          --repo "${{ github.repository }}"
          --generate-notes --title "${{ github.ref_name }}"
