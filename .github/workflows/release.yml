name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = python -c "from hwtstudio import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match application version v$version"
          }
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check hwtstudio tests tools run.py
          python -m compileall -q hwtstudio tests tools
          python -m unittest discover -s tests -v
      - name: Build
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "大雪主题编辑器" --add-data "assets;assets"
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick run.py
      - name: Prepare release assets
        shell: pwsh
        run: |
          $asset = "HwtThemeStudio-${{ github.ref_name }}-win64.exe"
          Copy-Item -LiteralPath "dist\大雪主题编辑器.exe" -Destination $asset
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "HwtThemeStudio-${{ github.ref_name }}-win64.exe"
          gh release create "${{ github.ref_name }}" $asset "$asset.sha256" --generate-notes --title "${{ github.ref_name }}"
