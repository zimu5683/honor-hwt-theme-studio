name: tests

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.15.22
      - name: Static checks
        run: python -m ruff check hwtstudio tests tools run.py
      - name: Compile sources
        run: python -m compileall -q hwtstudio tests tools
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Validate PyInstaller build
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --noupx
          --name "大雪主题编辑器" --add-data "assets;assets"
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick run.py
      - name: Verify portable desktop layout
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist\大雪主题编辑器\大雪主题编辑器.exe")) {
            throw "onedir 构建结果缺少桌面程序"
          }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test, lint and build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug

  android-instrumented:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && chmod +x gradlew && ./gradlew connectedDebugAndroidTest
