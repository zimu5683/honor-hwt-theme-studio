name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core dependencies
        run: python -m pip install Pillow lxml
      - name: Run tests
        run: python -m unittest discover -s tests -v
